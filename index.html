<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>機台紀錄系統</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* 隱藏原生滾動條，保持畫面整潔 */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const Icon = ({ name, size = 20, className = '' }) => {
      const icons = {
        Clock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        Save: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
        Trash2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1-2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
        FileSpreadsheet: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
        PlusCircle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
        Edit: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
        X: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
        ImageIcon: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
        Loader2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
        CalendarDays: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,
        Cloud: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
        Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
        CloudOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
        RefreshCw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,
        PenTool: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      };
      return <div className={`inline-block ${className}`}>{icons[name]}</div>;
    };

    const getLocalISODate = (dateObj = new Date()) => {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const formatDateForDisplay = (isoString) => {
      if (!isoString) return '';
      const parts = isoString.split('-');
      if (parts.length !== 3) return isoString;
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);
      const dateObj = new Date(isoString);
      const dayOfWeek = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
      return `${month}/${day}(週${dayOfWeek})`;
    };

    const getCurrentTimeString = () => {
      const now = new Date();
      return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    };

    const SignaturePad = ({ onSave, onCancel, initialSignature }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        const timer = setTimeout(() => {
          const rect = canvas.getBoundingClientRect();
          const ratio = window.devicePixelRatio || 1;
          
          canvas.width = rect.width * ratio;
          canvas.height = rect.height * ratio;
          
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 3 * ratio; 
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (initialSignature) {
             const img = new window.Image();
             img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
             };
             img.src = initialSignature;
          }
        }, 150); 

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          
          let clientX = e.clientX;
          let clientY = e.clientY;
          if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          }

          return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
          };
        };

        const startDrawing = (e) => {
          if(e.cancelable) e.preventDefault(); 
          isDrawing = true;
          const pos = getPos(e);
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        };

        const draw = (e) => {
          if(e.cancelable) e.preventDefault();
          if (!isDrawing) return;
          const pos = getPos(e);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        };

        const stopDrawing = (e) => {
          if(e.cancelable) e.preventDefault();
          isDrawing = false;
        };

        canvas.addEventListener('pointerdown', startDrawing, { passive: false });
        canvas.addEventListener('pointermove', draw, { passive: false });
        canvas.addEventListener('pointerup', stopDrawing, { passive: false });
        canvas.addEventListener('pointercancel', stopDrawing, { passive: false });
        canvas.addEventListener('pointerout', stopDrawing, { passive: false });

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });

        return () => {
          clearTimeout(timer);
          canvas.removeEventListener('pointerdown', startDrawing);
          canvas.removeEventListener('pointermove', draw);
          canvas.removeEventListener('pointerup', stopDrawing);
          canvas.removeEventListener('pointercancel', stopDrawing);
          canvas.removeEventListener('pointerout', stopDrawing);

          canvas.removeEventListener('touchstart', startDrawing);
          canvas.removeEventListener('touchmove', draw);
          canvas.removeEventListener('touchend', stopDrawing);
        };
      }, [initialSignature]);

      const handleClear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height); 
      };

      const handleSave = () => {
        const canvas = canvasRef.current;
        const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
        onSave(dataUrl);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col h-[60vh] max-h-[500px]">
             <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                <h3 className="font-bold text-slate-800 flex items-center gap-2">
                   <Icon name="PenTool" /> 員工簽名板 (可多人簽名)
                </h3>
                <button onClick={onCancel} className="text-slate-400 hover:text-slate-600">
                   <Icon name="X" size={24} />
                </button>
             </div>
             <div className="flex-1 bg-slate-200 relative p-2 flex flex-col min-h-0">
                <canvas ref={canvasRef} style={{ touchAction: 'none' }} className="w-full h-full block bg-white rounded-lg shadow-inner cursor-crosshair touch-none" />
                <div className="absolute top-6 left-6 text-slate-300 pointer-events-none text-xl font-bold opacity-30 select-none">
                   請在此處簽名
                </div>
             </div>
             <div className="p-4 flex gap-3 bg-white border-t">
                <button onClick={handleClear} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors">
                  重簽 (清除)
                </button>
                <button onClick={handleSave} className="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
                  完成簽名
                </button>
             </div>
          </div>
        </div>
      );
    };

    function App() {
      const tableRef = useRef(null);
      const summaryTableRef = useRef(null);

      const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbyjZUFfWcoPBO88YyXPJtsPdxMO7YyivgPtDZZ7R009HroPtup6_lNmOR090dclo8Adsw/exec";

      const [appConfig, setAppConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('machineAppConfig');
          let config = saved ? JSON.parse(saved) : { mode: 'api', apiUrl: MY_GAS_URL };
          if (config.apiUrl !== MY_GAS_URL || config.mode !== 'api') {
            config = { mode: 'api', apiUrl: MY_GAS_URL };
          }
          return config;
        } catch (e) {
          return { mode: 'api', apiUrl: MY_GAS_URL };
        }
      });

      const [showSettings, setShowSettings] = useState(false);
      const [records, setRecords] = useState([]);
      const [isFetching, setIsFetching] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const defaultForm = { 
          date: getLocalISODate(), 
          flatQty: '', pillowQty: '', 
          qty: '', 
          machine1: '', machine2: '', machine3: '', machine4: '', 
          workerCount: '', totalQty: '', 
          bedCover: '', 
          tableCloth: '', 
          bedCoverEndTime: '', 
          tableClothStartTime: '', 
          tableClothEndTime: '',
          onTime: '', offTime: '' 
      };
      const [formData, setFormData] = useState(defaultForm);
      const [signature, setSignature] = useState(null); 
      const [showSignaturePad, setShowSignaturePad] = useState(false); 
      const [editingId, setEditingId] = useState(null);

      const machineList = ['ICC平燙機', 'TF-30K', 'TB-60K', 'TB-80K', '撐開機'];
      const [activeMachine, setActiveMachine] = useState('總表'); 
      const [formMachine, setFormMachine] = useState(machineList[0]);

      const currentMonthPrefix = getLocalISODate().substring(0, 7);
      const currentDisplayMonth = new Date().getMonth() + 1;
      
      const currentMonthDates = useMemo(() => {
          const year = new Date().getFullYear();
          const month = new Date().getMonth();
          const numDays = new Date(year, month + 1, 0).getDate();
          return Array.from({ length: numDays }, (_, i) => `${year}-${String(month + 1).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}`);
      }, []);

      useEffect(() => {
        localStorage.setItem('machineAppConfig', JSON.stringify(appConfig));
        if (appConfig.mode === 'local') loadLocalRecords();
        else fetchCloudRecords();
      }, [appConfig]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const loadLocalRecords = () => {
        try {
          const saved = localStorage.getItem('machineRecords_local_v3');
          if (saved) setRecords(JSON.parse(saved));
          else setRecords([]);
        } catch (e) {}
      };

      const saveLocalRecords = (newRecords) => {
        localStorage.setItem('machineRecords_local_v3', JSON.stringify(newRecords));
        setRecords(newRecords);
      };

      // 🌟 使用現代 fetch 搭配 AbortController 解決 Safari CORS 與重定向問題
      const fetchCloudRecords = async () => {
        if (!appConfig.apiUrl) return;
        setIsFetching(true);
        
        // 設定 20 秒超時機制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);
        
        try {
          const cacheBusterUrl = `${appConfig.apiUrl}${appConfig.apiUrl.includes('?') ? '&' : '?'}t=${new Date().getTime()}`;
          
          const response = await fetch(cacheBusterUrl, {
            method: 'GET',
            redirect: 'follow', // 關鍵：讓 Safari 自動跟隨 GAS 的 302 重定向
            signal: controller.signal
          });

          if (!response.ok) {
             throw new Error(`伺服器回應錯誤: ${response.status}`);
          }
          
          const textData = await response.text();
          
          if (textData.includes('<!DOCTYPE html>')) {
             throw new Error('遇到 Google 登入攔截或無權限存取');
          }
          
          const data = JSON.parse(textData);

          if (Array.isArray(data)) {
            setRecords(data);
            saveLocalRecords(data); 
            showToast("已取得最新雲端紀錄");
          }
        } catch (error) {
            console.error("Fetch Error:", error);
            if (error.name === 'AbortError') {
               showToast(`蘋果 Safari 載入超時，暫時顯示本機快取`);
            } else {
               showToast(`抓取失敗: ${error.message}`);
            }
            loadLocalRecords(); 
        } finally {
            clearTimeout(timeoutId);
            setIsFetching(false);
        }
      };

      // 🌟 使用 fetch 並改為 text/plain 避免 Safari 預檢請求 (OPTIONS) 失敗
      const sendToCloud = async (action, payload) => {
        if (!appConfig.apiUrl) return false;
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);
        
        try {
          const bodyData = JSON.stringify({ action: action, ...payload });
          
          const response = await fetch(appConfig.apiUrl, {
            method: 'POST',
            redirect: 'follow', // 關鍵：跟隨重定向
            headers: {
              'Content-Type': 'text/plain;charset=utf-8', // 騙過瀏覽器，不發 OPTIONS 預檢
            },
            body: bodyData,
            signal: controller.signal
          });

          if (!response.ok) {
             throw new Error(`伺服器回應錯誤: ${response.status}`);
          }
          
          const responseData = await response.json();
          
          if (responseData.status === 'success') {
             return true;
          } else {
             showToast(`背景儲存失敗: ${responseData.message}`);
             return false;
          }
        } catch (error) {
          console.error("Upload Error:", error);
          if (error.name === 'AbortError') {
             showToast(`背景傳送超時，已安全暫存於本機`); 
          } else {
             showToast(`背景傳送失敗，已安全暫存於本機`); 
          }
          return false;
        } finally {
          clearTimeout(timeoutId);
        }
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const setTimeNow = (field) => {
        setFormData(prev => ({ ...prev, [field]: getCurrentTimeString() }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.date) { showToast("請選擇日期！"); return; }

        const newId = editingId ? editingId : Date.now().toString();
        const targetMachine = activeMachine === '總表' ? formMachine : activeMachine;
        
        const bEndTime = formData.bedCover || formData.bedCoverEndTime || '';
        const tcStart = formData.tableClothStartTime || '';
        const tcEnd = formData.tableClothEndTime || '';
        let tcCombined = formData.tableCloth || '';
        if (tcStart || tcEnd) {
          tcCombined = `${tcStart}~${tcEnd}`;
        }

        const recordToSave = { 
          ...formData, 
          id: newId, 
          machine: targetMachine, 
          signature: signature,
          bedCover: bEndTime,
          bedCoverEndTime: bEndTime,
          tableCloth: tcCombined,
          tableClothStartTime: tcStart,
          tableClothEndTime: tcEnd
        };

        let updatedRecords = editingId ? records.map(r => r.id === editingId ? recordToSave : r) : [...records, recordToSave];

        setRecords(updatedRecords);
        saveLocalRecords(updatedRecords); 

        setEditingId(null);
        setFormData({ ...defaultForm, date: getLocalISODate() });
        setSignature(null);
        showToast("已暫存，背景上傳中...");

        if (appConfig.mode === 'api' && appConfig.apiUrl) {
           setIsSyncing(true);
           sendToCloud(editingId ? 'update' : 'create', { record: recordToSave }).then(success => {
               if (success) showToast("✓ 雲端同步完成");
               setIsSyncing(false);
           });
        }
      };

      const handleEdit = (record) => {
        const bEnd = record.bedCoverEndTime || record.bedCover || '';
        let tcStart = record.tableClothStartTime || '';
        let tcEnd = record.tableClothEndTime || '';
        if (!tcStart && !tcEnd && record.tableCloth) {
          const parts = String(record.tableCloth).split('~');
          tcStart = parts[0] || '';
          tcEnd = parts[1] || '';
        }

        setFormData({
          date: record.date || '',
          flatQty: record.flatQty || '',
          pillowQty: record.pillowQty || '',
          qty: record.qty || record.flatQty || '',
          machine1: record.machine1 || '',
          machine2: record.machine2 || '',
          machine3: record.machine3 || '',
          machine4: record.machine4 || '',
          workerCount: record.workerCount || '',
          totalQty: record.totalQty || '',
          bedCover: bEnd,
          bedCoverEndTime: bEnd,
          tableCloth: record.tableCloth || (tcStart || tcEnd ? `${tcStart}~${tcEnd}` : ''),
          tableClothStartTime: tcStart,
          tableClothEndTime: tcEnd,
          onTime: record.onTime || '',
          offTime: record.offTime || ''
        });
        setFormMachine(record.machine === 'ICC' ? 'ICC平燙機' : (record.machine || machineList[0]));
        setSignature(record.signature || null);
        setEditingId(record.id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCancelEdit = () => {
        setFormData({ ...defaultForm, date: getLocalISODate() });
        setSignature(null);
        setEditingId(null);
      };

      const handleDelete = (id) => {
        if(window.confirm('確定要刪除這筆紀錄嗎？')) {
          const updatedRecords = records.filter(record => record.id !== id);
          setRecords(updatedRecords);
          saveLocalRecords(updatedRecords);

          if (appConfig.mode === 'api' && appConfig.apiUrl) {
             setIsSyncing(true);
             sendToCloud('delete', { id: id }).then(success => {
                if(success) showToast("✓ 雲端已刪除");
                setIsSyncing(false);
             });
          }
        }
      };

      const handleShareImage = async () => {
        if (activeMachine !== '總表' && sortedCurrentMonthRecords.length === 0) {
          showToast("當月沒有資料可以分享喔"); return;
        }
        if (!window.html2canvas) { showToast("截圖模組載入中，請稍候"); return; }
        
        const targetElement = activeMachine === '總表' ? summaryTableRef.current : tableRef.current;
        if (!targetElement) return;

        setIsGenerating(true);
        showToast("正在產生完美表格截圖...");

        try {
          const canvas = await window.html2canvas(targetElement, {
            backgroundColor: "#ffffff", scale: 2, useCORS: true,
            onclone: (clonedDoc) => {
              const outer = clonedDoc.querySelector('[data-screenshot-outer="true"]');
              const scroll = clonedDoc.querySelector('[data-screenshot-scroll="true"]');
              if (outer) { outer.style.width = 'max-content'; outer.style.minWidth = '100%'; }
              if (scroll) { scroll.style.overflow = 'visible'; }
            }
          });

          canvas.toBlob(async (blob) => {
            if (!blob) throw new Error("Canvas is empty");
            const fileName = `${activeMachine}_${currentDisplayMonth}月.png`;
            const file = new File([blob], fileName, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({ files: [file], title: `${activeMachine}紀錄表`, text: `傳送 ${currentDisplayMonth}月份 ${activeMachine}紀錄表` });
                showToast("準備分享！");
              } catch (err) {}
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = fileName; a.click(); URL.revokeObjectURL(url);
              showToast("圖片已下載");
            }
            setIsGenerating(false);
          }, 'image/png');
        } catch (error) {
          showToast("產生圖片失敗，請重試"); setIsGenerating(false);
        }
      };

      const sortedCurrentMonthRecords = records
        .filter(record => record.date && record.date.startsWith(currentMonthPrefix))
        .filter(record => {
           const dbMachineName = record.machine === 'ICC' ? 'ICC平燙機' : (record.machine || 'ICC平燙機');
           if (activeMachine === '總表') return true; 
           return dbMachineName === activeMachine;
        })
        .sort((a, b) => {
           const dateDiff = a.date.localeCompare(b.date);
           if (dateDiff !== 0) return dateDiff;
           const timeA = a.onTime || '00:00';
           const timeB = b.onTime || '00:00';
           return timeA.localeCompare(timeB);
        });
        
      const summaryData = useMemo(() => {
          const dataMap = {};
          currentMonthDates.forEach(date => {
              dataMap[date] = {};
              machineList.forEach(m => dataMap[date][m] = null);
          });
          
          records.forEach(record => {
             if (record.date && record.date.startsWith(currentMonthPrefix)) {
                 const dbMachineName = record.machine === 'ICC' ? 'ICC平燙機' : (record.machine || 'ICC平燙機');
                 if (dataMap[record.date] && machineList.includes(dbMachineName)) {
                     const existing = dataMap[record.date][dbMachineName];
                     if (existing) {
                         const getNum = val => parseInt(val) || 0;
                         const flat = getNum(existing.flatQty) + getNum(record.flatQty);
                         const pillow = getNum(existing.pillowQty) + getNum(record.pillowQty);
                         const oldQty = getNum(existing.qty || existing.flatQty) + getNum(record.qty || record.flatQty);
                         const totalQ = getNum(existing.totalQty) + getNum(record.totalQty);
                         
                         dataMap[record.date][dbMachineName] = {
                             flatQty: flat > 0 ? flat.toString() : (record.flatQty === '0' || existing.flatQty === '0' ? '0' : ''),
                             pillowQty: pillow > 0 ? pillow.toString() : (record.pillowQty === '0' || existing.pillowQty === '0' ? '0' : ''),
                             qty: oldQty > 0 ? oldQty.toString() : (record.qty === '0' || existing.qty === '0' ? '0' : ''),
                             totalQty: totalQ > 0 ? totalQ.toString() : (record.totalQty === '0' || existing.totalQty === '0' ? '0' : ''),
                             hasRecord: true
                         };
                     } else {
                         dataMap[record.date][dbMachineName] = { 
                           ...record,
                           qty: record.qty || record.flatQty || '',
                           hasRecord: true
                         };
                     }
                 }
             } 
          });
          return dataMap;
      }, [records, currentMonthPrefix, currentMonthDates, machineList]);

                </div>
              </div>

                      <input type="text" name="machine1" value={formData.machine1} onChange={handleInputChange} className="w-full p-2 bg-white border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 outline-none text-sm" placeholder="1號夾數量" />
                      <input type="text" name="machine2" value={formData.machine2} onChange={handleInputChange} className="w-full p-2 bg-white border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 outline-none text-sm" placeholder="2號夾數量" />
                      <input type="text" name="machine3" value={formData.machine3} onChange={handleInputChange} className="w-full p-2 bg-white border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 outline-none text-sm" placeholder="3號夾數量" />
                      <input type="text" name="machine4" value={formData.machine4} onChange={handleInputChange} className="w-full p-2 bg-white border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 outline-none text-sm" placeholder="4號夾數量" />
                    </div>

                    <div>

                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">單日總量</label>
                      <input type="text" name="totalQty" value={formData.totalQty} onChange={handleInputChange} className="w-full p-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-bold text-purple-800" placeholder="總計數量" />
                    </div>
                 </div>

                        />
                      </div>
                    </div>
                    
                    <div className="bg-white p-3 border border-slate-200 rounded-lg shadow-sm">
                      <label className="block text-sm font-bold text-slate-700 mb-2 border-b border-slate-100 pb-1">檯布</label>
                      <div className="grid grid-cols-2 gap-2">
                        <div>

                          <input 
                            type="time" 
                            value={formData.tableClothStartTime || ''} 
                            onChange={(e) => {

                              const end = formData.tableClothEndTime || '';
                              setFormData(prev => ({

                        </div>
                        <div>

                          <input

                          />
                        </div>
                      </div>
                    </div>
                 </div>
              </div>
           );
        } else {

               </>
            );
         }

      const renderTableCells = (record) => {
         if (activeMachine === 'ICC平燙機') {
            return (
               <>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    <div className="text-blue-600 font-bold mb-1">開: {record.onTime || '--:--'}</div>
                    <div className="text-red-600 font-bold">關: {record.offTime || '--:--'}</div>
                  </td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    <div className="text-slate-700 mb-1">平: <span className="font-bold text-lg">{record.flatQty || '-'}</span></div>
                    <div className="text-slate-700">枕: <span className="font-bold text-lg">{record.pillowQty || '-'}</span></div>
                  </td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    {record.signature ? <img src={record.signature} alt="簽名" className="h-10 object-contain border border-slate-200 rounded bg-white px-1" /> : <span className="text-slate-400 text-sm">無簽名</span>}
                  </td>
               </>
            );
         } else if (activeMachine === '撐開機') {
            const bEnd = record.bedCoverEndTime || record.bedCover || '';
            let tcStart = record.tableClothStartTime || '';
            let tcEnd = record.tableClothEndTime || '';
            if (!tcStart && !tcEnd && record.tableCloth) {
              const parts = String(record.tableCloth).split('~');
              tcStart = parts[0] || '';
              tcEnd = parts[1] || '';
            }

            return (
               <>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    <div className="text-blue-600 font-bold mb-1">開: {record.onTime || '--:--'}</div>
                    <div className="text-red-600 font-bold">關: {record.offTime || '--:--'}</div>
                  </td>
                  <td className="px-2 py-4 whitespace-nowrap border-l border-slate-100 text-center font-medium">{record.machine1 || '-'}</td>
                  <td className="px-2 py-4 whitespace-nowrap text-center font-medium">{record.machine2 || '-'}</td>
                  <td className="px-2 py-4 whitespace-nowrap text-center font-medium">{record.machine3 || '-'}</td>
                  <td className="px-2 py-4 whitespace-nowrap border-r border-slate-100 text-center font-medium">{record.machine4 || '-'}</td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap text-center font-bold text-slate-600">{record.workerCount || '-'}</td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap text-center font-bold text-xl text-purple-700 bg-purple-50/30">{record.totalQty || '-'}</td>
                  
                  <td className="px-2 md:px-4 py-2 whitespace-nowrap text-center">
                    {bEnd ? <div className="text-sm text-red-600 font-medium">關: {bEnd}</div> : <span className="text-slate-300">-</span>}
                  </td>
                  <td className="px-2 md:px-4 py-2 whitespace-nowrap text-center">
                    {tcStart && <div className="text-sm text-blue-600 font-medium">開: {tcStart}</div>}
                    {tcEnd && <div className="text-sm text-red-600 font-medium mt-0.5">關: {tcEnd}</div>}
                    {!tcStart && !tcEnd && <span className="text-slate-300">-</span>}
                  </td>
                  
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    {record.signature ? <img src={record.signature} alt="簽名" className="h-8 object-contain border border-slate-200 rounded bg-white px-1" /> : <span className="text-slate-400 text-sm">無</span>}
                  </td>
               </>
            );
         } else {
            return (
               <>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    <div className="text-blue-600 font-bold mb-1">開: {record.onTime || '--:--'}</div>
                    <div className="text-red-600 font-bold">關: {record.offTime || '--:--'}</div>
                  </td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                     <span className="font-bold text-xl text-slate-800">{record.qty || record.flatQty || '-'}</span>
                  </td>
                  <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                    {record.signature ? <img src={record.signature} alt="簽名" className="h-10 object-contain border border-slate-200 rounded bg-white px-1" /> : <span className="text-slate-400 text-sm">無簽名</span>}
                  </td>
               </>

         }

      return (
        <div className="min-h-screen p-2 md:p-4 pb-20 relative">

          {toastMessage && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-2xl flex items-center gap-2 transition-all font-bold">
              {isFetching || isSyncing || isGenerating ? <Icon name="Loader2" className="animate-spin" size={20} /> : <Icon name="Save" size={20} />}
              {toastMessage}
            </div>
          )}

          {showSignaturePad && (
            <SignaturePad 
               initialSignature={signature}
               onSave={(dataUrl) => { setSignature(dataUrl); setShowSignaturePad(false); }}
               onCancel={() => setShowSignaturePad(false)}
            />
          )}

          {showSettings && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                  <Icon name="Cloud" size={24} className="text-blue-500" /> 管理員設定
                </h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">綁定 Google 試算表</label>
                    <input type="text" value={MY_GAS_URL} readOnly className="w-full p-2 border border-slate-200 bg-slate-100 rounded-lg outline-none font-mono text-xs text-slate-500" />
                  </div>
                </div>
                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icon name="X" size={24} /></button>
              </div>
            </div>

          <div className="max-w-[1400px] mx-auto space-y-4 md:space-y-6">

            <header className="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className={`p-3 rounded-lg ${appConfig.mode === 'api' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'}`}>
                  <Icon name="FileSpreadsheet" size={32} />

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1 flex items-center gap-1">
                      <Icon name="CalendarDays" size={16} className="text-blue-500"/> 選擇日期
                    </label>
                    <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none font-medium cursor-pointer" />
                  </div>

                  <div className="p-3 bg-blue-50/50 rounded-lg space-y-3 border border-blue-100">
                    <div>
                      <label className="block text-sm font-medium text-blue-900 mb-1">開機時間</label>
                      <div className="flex gap-2">
                        <input type="time" name="onTime" value={formData.onTime} onChange={handleInputChange} className="flex-1 p-2.5 bg-white border border-slate-300 rounded-lg outline-none" />
                        <button type="button" onClick={() => setTimeNow('onTime')} className="px-3 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-sm flex items-center gap-1"><Icon name="Clock" size={16} /> 現在</button>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-blue-900 mb-1">關機時間</label>
                      <div className="flex gap-2">
                        <input type="time" name="offTime" value={formData.offTime} onChange={handleInputChange} className="flex-1 p-2.5 bg-white border border-slate-300 rounded-lg outline-none" />
                        <button type="button" onClick={() => setTimeNow('offTime')} className="px-3 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-sm flex items-center gap-1"><Icon name="Clock" size={16} /> 現在</button>
                      </div>
                    </div>
                  </div>

                  {renderFormFields()}

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">員工簽名</label>
                    <div onClick={() => setShowSignaturePad(true)} className={`w-full min-h-[80px] p-2 bg-slate-50 border border-slate-300 rounded-lg cursor-pointer hover:bg-blue-50 flex items-center justify-center ${signature ? 'border-blue-400 border-2' : 'border-dashed border-2'}`}>
                      {signature ? <img src={signature} alt="員工簽名" className="max-h-[70px] max-w-full object-contain" /> : <div className="text-slate-400 flex flex-col items-center gap-1"><Icon name="PenTool" size={24} /><span className="text-sm font-medium">點擊此處手寫簽名</span></div>}
                    </div>
                  </div>

                  <button type="submit" className={`w-full mt-4 text-white font-bold p-3.5 rounded-lg shadow-sm transition-colors flex justify-center items-center gap-2 ${editingId ? 'bg-orange-500' : 'bg-blue-600'}`}>
                    <Icon name="Save" size={20} />
                    {editingId ? '更新紀錄 (瞬間完成)' : '儲存紀錄 (瞬間完成)'}
                  </button>
                </form>
              </div>

              {activeMachine !== '總表' && (
                  <div className="xl:col-span-3 relative">
                    {isFetching && <div className="absolute inset-0 bg-white/40 z-10 flex items-center justify-center rounded-xl"></div>}
                    <div ref={tableRef} data-screenshot-outer="true" className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col w-full">
                      <div className="p-4 md:p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <h2 className="text-xl font-extrabold text-slate-800">{activeMachine} {currentDisplayMonth}月份紀錄</h2>
                        <div className="text-sm px-3 py-1 bg-blue-100 text-blue-800 font-bold rounded-lg">共 {sortedCurrentMonthRecords.length} 筆</div>
                      </div>

                      <div data-screenshot-scroll="true" className="overflow-x-auto flex-1 p-2 md:p-4 min-h-[300px]">
                        <table className="w-full text-base text-left min-w-max">
                          <thead className="text-slate-500 border-b-2 border-slate-200 bg-white">
                            <tr>
                              <th className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-slate-700">日期</th>
                              {renderTableHeaders()}
                              <th data-html2canvas-ignore="true" className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-center text-slate-700 border-l border-slate-100">操作</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {sortedCurrentMonthRecords.map((record) => (
                              <tr key={record.id} className="hover:bg-slate-50 transition-colors">
                                <td className="px-2 md:px-4 py-4 whitespace-nowrap font-bold text-slate-800 text-lg">{formatDateForDisplay(record.date)}</td>
                                {renderTableCells(record)}
                                <td data-html2canvas-ignore="true" className="px-2 md:px-4 py-4 whitespace-nowrap text-center border-l border-slate-100">
                                  <div className="flex justify-center gap-2">
                                    <button onClick={() => handleEdit(record)} className="text-blue-500 hover:bg-blue-100 p-2 rounded transition-colors"><Icon name="Edit" size={20} /></button>
                                    <button onClick={() => handleDelete(record.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded transition-colors"><Icon name="Trash2" size={20} /></button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                            {sortedCurrentMonthRecords.length === 0 && (
                              <tr><td colSpan="12" className="px-4 py-12 text-center text-slate-500 text-lg">本月目前還沒有紀錄資料</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                      <div className="px-4 py-2 text-right text-xs text-slate-300 font-medium bg-white">ICC Factory System - Sync Enabled</div>
                    </div>
                  </div>
              )}

              {activeMachine === '總表' && (
                  <div className="relative w-full overflow-x-auto">
                    {isFetching && <div className="absolute inset-0 bg-white/40 z-10 flex items-center justify-center rounded-xl"></div>}
                    <div ref={summaryTableRef} data-screenshot-outer="true" className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col w-full min-w-max">
                      <div className="p-4 md:p-5 bg-white border-b border-slate-200">
                        <h2 className="text-xl md:text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                          🗓️ 115年{currentDisplayMonth}月份設備總結算表 <span className="text-base text-slate-500">({currentDisplayMonth}/1 - {currentDisplayMonth}/{currentMonthDates.length})</span>
                        </h2>
                      </div>

                      <div data-screenshot-scroll="true" className="overflow-x-auto flex-1 pb-4">
                        <table className="w-full text-base text-center border-collapse">
                          <thead className="bg-[#93C5FD] text-slate-800 border-b border-slate-300">
                            <tr>
                              <th className="px-6 py-4 font-bold border border-slate-300 min-w-[140px] text-lg">日期</th>
                              {machineList.map(machine => (
                                  <th key={machine} className="px-6 py-4 font-bold border border-slate-300 whitespace-nowrap text-lg">
                                      {machine}用量
                                  </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="bg-white">
                            {currentMonthDates.map((dateStr) => {
                                const rowData = summaryData[dateStr];
                                return (
                                  <tr key={dateStr} className="hover:bg-slate-50 transition-colors border-b border-slate-200">
                                    <td className="px-6 py-3 font-bold text-slate-800 border border-slate-200 whitespace-nowrap bg-blue-50/30">
                                      {formatDateForDisplay(dateStr)}
                                    </td>
                                    {machineList.map(machine => {
                                        const mData = rowData[machine];
                                        return (
                                            <td key={machine} className="px-6 py-4 border border-slate-200 align-middle">
                                                {mData ? (
                                                    <div className="flex flex-col items-center justify-center">
                                                        {machine === 'ICC平燙機' && (mData.flatQty || mData.pillowQty) && (
                                                           <div className="text-blue-800 font-bold text-[16px] whitespace-nowrap">
                                                              {mData.flatQty && <span>平:{mData.flatQty} </span>}
                                                              {mData.pillowQty && <span>枕:{mData.pillowQty}</span>}
                                                           </div>
                                                        )}
                                                        {machine === '撐開機' && mData.totalQty && (
                                                           <span className="text-purple-700 font-extrabold text-[18px]">總量:{mData.totalQty}</span>
                                                        )}
                                                        {['TF-30K', 'TB-60K', 'TB-80K'].includes(machine) && mData.qty && (
                                                           <span className="text-slate-800 font-bold text-[18px]">{mData.qty}</span>
                                                        )}
                                                        
                                                        {((machine === 'ICC平燙機' && !mData.flatQty && !mData.pillowQty) || 
                                                          (machine === '撐開機' && !mData.totalQty) || 
                                                          (['TF-30K', 'TB-60K', 'TB-80K'].includes(machine) && !mData.qty)) && (
                                                            <span className="text-slate-400 text-sm italic">有紀錄但無數量</span>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <span className="text-blue-600 font-bold text-xl">-</span>
                                                )}
                                            </td>
                                        )
                                    })}
                                  </tr>
                                );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
